name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to the current ref name)'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub Release as prerelease'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.12.3'
  RUST_BACKTRACE: '1'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-14
            platform: macos
          - name: Windows x64
            os: windows-2022
            platform: windows
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "A release tag is required when running this workflow manually from a branch." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != ''
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin "refs/tags/${{ steps.release.outputs.tag }}:refs/tags/${{ steps.release.outputs.tag }}"
          git checkout --detach "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Tauri updater signing key
        shell: bash
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/tauri_signing.key"
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY_SECRET:-}" ]; then
            echo "TAURI_PRIVATE_KEY_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "No TAURI_SIGNING_PRIVATE_KEY secret configured; updater artifacts will be skipped."
            exit 0
          fi

          if printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" | awk 'NR == 1 { exit ($0 ~ /^untrusted comment:/ ? 0 : 1) }'; then
            printf '%s\n' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" > "$KEY_PATH"
          elif DECODED=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" | base64 --decode 2>/dev/null || printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" | base64 -D 2>/dev/null) \
            && printf '%s' "$DECODED" | awk 'NR == 1 { exit ($0 ~ /^untrusted comment:/ ? 0 : 1) }'; then
            printf '%s\n' "$DECODED" > "$KEY_PATH"
          else
            ONE=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_SECRET" | tr -d '\r\n')
            printf '%s\n%s\n' 'untrusted comment: tauri signing key' "$ONE" > "$KEY_PATH"
          fi

          {
            echo 'TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY'
            cat "$KEY_PATH"
            echo 'TAURI_KEY'
          } >> "$GITHUB_ENV"
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET:-}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          fi
          echo "TAURI_PRIVATE_KEY_CONFIGURED=true" >> "$GITHUB_ENV"
        env:
          TAURI_SIGNING_PRIVATE_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Import Apple signing certificate
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD_SECRET: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          if [ -z "${APPLE_CERTIFICATE_SECRET:-}" ]; then
            echo "No APPLE_CERTIFICATE secret configured; macOS artifact will be built without Developer ID signing."
            exit 0
          fi
          if [ -z "${APPLE_CERTIFICATE_PASSWORD_SECRET:-}" ] || [ -z "${KEYCHAIN_PASSWORD_SECRET:-}" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD and KEYCHAIN_PASSWORD are required when APPLE_CERTIFICATE is configured." >&2
            exit 1
          fi
          printf '%s' "$APPLE_CERTIFICATE_SECRET" | base64 --decode > "$CERT_PATH"

          ORIGINAL_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"')
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD_SECRET" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD_SECRET" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD_SECRET" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD_SECRET" "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in imported certificate." >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Build macOS app
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ "$TAURI_PRIVATE_KEY_CONFIGURED" = "true" ]; then
            EXTRA_CONFIG='{}'
          else
            EXTRA_CONFIG='{"bundle":{"createUpdaterArtifacts":false}}'
          fi
          pnpm tauri build --target universal-apple-darwin --config "$EXTRA_CONFIG"

      - name: Build Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TAURI_PRIVATE_KEY_CONFIGURED -eq 'true') {
            pnpm tauri build
          } else {
            pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          }

      - name: Build Linux app
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TAURI_PRIVATE_KEY_CONFIGURED" = "true" ]; then
            EXTRA_CONFIG='{}'
          else
            EXTRA_CONFIG='{"bundle":{"createUpdaterArtifacts":false}}'
          fi
          pnpm tauri build --bundles appimage,deb,rpm --config "$EXTRA_CONFIG"

      - name: Prepare macOS release assets
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.release.outputs.tag }}'
          mkdir -p release-assets

          APP_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | sort | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No macOS .app bundle was produced." >&2
            exit 1
          fi

          TAR_GZ=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.tar.gz' -type f | sort | head -n 1 || true)
          if [ -n "$TAR_GZ" ]; then
            cp "$TAR_GZ" "release-assets/CC-Switch-Lite-$VERSION-macOS.tar.gz"
            if [ -f "$TAR_GZ.sig" ]; then
              cp "$TAR_GZ.sig" "release-assets/CC-Switch-Lite-$VERSION-macOS.tar.gz.sig"
            fi
          fi

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/CC-Switch-Lite-$VERSION-macOS.zip"

          DMG=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f | sort | head -n 1 || true)
          if [ -n "$DMG" ]; then
            cp "$DMG" "release-assets/CC-Switch-Lite-$VERSION-macOS.dmg"
          fi

      - name: Prepare Windows release assets
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.release.outputs.tag }}'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $msi = Get-ChildItem -Path src-tauri/target/release/bundle -Recurse -Filter *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            throw 'No Windows MSI installer was produced.'
          }
          $msiDest = "CC-Switch-Lite-$version-Windows-x64.msi"
          Copy-Item $msi.FullName (Join-Path release-assets $msiDest)
          if (Test-Path "$($msi.FullName).sig") {
            Copy-Item "$($msi.FullName).sig" (Join-Path release-assets "$msiDest.sig")
          }

          $exe = Get-ChildItem -Path src-tauri/target/release -Filter *.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $exe) {
            $portableDir = Join-Path $env:RUNNER_TEMP 'ccslite-portable'
            New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
            Copy-Item $exe.FullName $portableDir
            Set-Content -Path (Join-Path $portableDir 'portable.ini') -Value @('portable=true') -Encoding UTF8
            Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath "release-assets/CC-Switch-Lite-$version-Windows-x64-Portable.zip" -Force
          }

      - name: Prepare Linux release assets
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.release.outputs.tag }}'
          mkdir -p release-assets

          APPIMAGE=$(find src-tauri/target/release/bundle -name '*.AppImage' -type f | sort | head -n 1 || true)
          if [ -z "$APPIMAGE" ]; then
            echo "No Linux AppImage was produced." >&2
            exit 1
          fi
          cp "$APPIMAGE" "release-assets/CC-Switch-Lite-$VERSION-Linux-x86_64.AppImage"
          if [ -f "$APPIMAGE.sig" ]; then
            cp "$APPIMAGE.sig" "release-assets/CC-Switch-Lite-$VERSION-Linux-x86_64.AppImage.sig"
          fi

          DEB=$(find src-tauri/target/release/bundle -name '*.deb' -type f | sort | head -n 1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/CC-Switch-Lite-$VERSION-Linux-x86_64.deb"
          fi

          RPM=$(find src-tauri/target/release/bundle -name '*.rpm' -type f | sort | head -n 1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/CC-Switch-Lite-$VERSION-Linux-x86_64.rpm"
          fi

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print | sort

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

      - name: Restore default macOS keychain
        if: matrix.platform == 'macos' && always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "A release tag is required when running this workflow manually from a branch." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Generate latest.json when updater signatures exist
        shell: bash
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if ! find release-assets -maxdepth 1 -name '*.sig' -type f | grep -q .; then
            echo "No updater signatures found; latest.json will not be generated."
            exit 0
          fi

          export PUB_DATE
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dir = 'release-assets';
          const tag = process.env.TAG;
          const version = tag.replace(/^v/, '');
          const pubDate = process.env.PUB_DATE;
          const baseUrl = process.env.BASE_URL;
          const platforms = {};

          for (const sigName of fs.readdirSync(dir).filter((name) => name.endsWith('.sig')).sort()) {
            const assetName = sigName.slice(0, -4);
            const signature = fs.readFileSync(path.join(dir, sigName), 'utf8').trim();
            const url = `${baseUrl}/${assetName}`;
            if (assetName.endsWith('-macOS.tar.gz')) {
              platforms['darwin-aarch64'] = { signature, url };
              platforms['darwin-x86_64'] = { signature, url };
            } else if (assetName.endsWith('-Windows-x64.msi')) {
              platforms['windows-x86_64'] = { signature, url };
            } else if (assetName.endsWith('-Linux-x86_64.AppImage')) {
              platforms['linux-x86_64'] = { signature, url };
            }
          }

          if (Object.keys(platforms).length === 0) {
            process.exit(0);
          }

          fs.writeFileSync('release-assets/latest.json', `${JSON.stringify({
            version,
            notes: `Release ${tag}`,
            pub_date: pubDate,
            platforms,
          }, null, 2)}\n`);
          NODE

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: CC Switch Lite ${{ steps.release.outputs.tag }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## CC Switch Lite ${{ steps.release.outputs.tag }}

            Claude Code / Codex / Gemini CLI provider switcher.

            ### Downloads

            - macOS: `CC-Switch-Lite-${{ steps.release.outputs.tag }}-macOS.dmg` or `CC-Switch-Lite-${{ steps.release.outputs.tag }}-macOS.zip`
            - Windows: `CC-Switch-Lite-${{ steps.release.outputs.tag }}-Windows-x64.msi` or `CC-Switch-Lite-${{ steps.release.outputs.tag }}-Windows-x64-Portable.zip`
            - Linux: `CC-Switch-Lite-${{ steps.release.outputs.tag }}-Linux-x86_64.AppImage`, `.deb`, or `.rpm`

            If updater signing is configured, `latest.json` and matching `.sig` files are attached for Tauri updater clients.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  publish-homebrew:
    name: Publish Homebrew Cask
    runs-on: ubuntu-22.04
    needs: publish
    if: always()
    steps:
      - name: Check Homebrew configuration
        id: homebrew
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN_SECRET: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN_SECRET:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew cask update."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag
        if: steps.homebrew.outputs.enabled == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ]; then
            echo "A release tag is required when running this workflow manually from a branch." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download macOS DMG from release
        if: steps.homebrew.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET="CC-Switch-Lite-$TAG-macOS.dmg"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir .
          test -f "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d ' ' -f 1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
        id: dmg

      - name: Checkout Homebrew tap
        if: steps.homebrew.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: SHLE1/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask
        if: steps.homebrew.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Casks
          CASK_PATH="homebrew-tap/Casks/cc-switch-lite.rb"
          URL="https://github.com/$REPO/releases/download/$TAG/CC-Switch-Lite-$TAG-macOS.dmg"
          cat > "$CASK_PATH" <<CASK
          cask "cc-switch-lite" do
            version "$VERSION"
            sha256 "$SHA256"

            url "$URL",
                verified: "github.com/$REPO/"
            name "CC Switch Lite"
            desc "Provider switcher for Claude Code, Codex, and Gemini CLI"
            homepage "https://github.com/$REPO"

            app "CC Switch Lite.app"
          end
          CASK
          ruby -0pi -e 'gsub(/^ {10}/, "")' "$CASK_PATH"

      - name: Push cask update
        if: steps.homebrew.outputs.enabled == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cc-switch-lite.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask already up to date."
            exit 0
          fi
          git commit -m "Update cc-switch-lite to $VERSION"
          git push